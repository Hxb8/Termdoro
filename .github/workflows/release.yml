name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: termdoro
            asset_name: termdoro-linux.tar.gz
          - os: windows-latest
            artifact_name: termdoro.exe
            asset_name: termdoro-windows.zip
          - os: macos-latest
            artifact_name: termdoro
            asset_name: termdoro-macos.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libdbus-1-dev

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -trimpath -o ${{ matrix.artifact_name }} ./cmd/termdoro

      - name: Package Assets (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czf ${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Package Assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
