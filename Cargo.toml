[package]
name = "termdoro"
version = "1.0.9"
edition = "2021"
authors = ["hexbyte16 islamamara062@gmail.com"]
description = "Terminal Pomodoro timer with Discord Rich Presence and YouTube BGM support."
license = "MIT"
repository = "https://github.com/Hxb8/Termdoro"


exclude = [
    "target/*",
    "bgm/*",
    "screenshots/*",
    "alert.mp3",
    "*.png",
    "*.tar.gz",
    "*.zip",
    ".github/*"
]


[dependencies]
ratatui = "0.26"
crossterm = "0.27"
discord-rich-presence = "0.2"
notify-rust = "4"
rodio = "0.17"
reqwest = { version = "0.11", features = ["blocking"] }
dirs = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

